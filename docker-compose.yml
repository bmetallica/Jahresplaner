services:
  jahresplaner:
    image: bmetallica/jahresplaner:latest
    container_name: jahresplaner
    restart: unless-stopped
    ports:
      - "3089:3089"
    environment:
      # Port anpassen (optional, Standard: 3089)
      - PORT=3089
    volumes:
      # Persistente Daten - Config und Termine
      - jahresplaner-data:/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3089"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - jahresplaner-network

networks:
  jahresplaner-network:
    driver: bridge

volumes:
  jahresplaner-data:
    driver: local
